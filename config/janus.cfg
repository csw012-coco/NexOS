video_mode=fb

menuentry "NexOS(default)" {
    kernel BOOT/NEX.ELF
    module BOOT/RAMDISK.IMG
    module BOOT/FONT.BDF
    cmdline console=framebuffer video=1024x768x32 root=NexOS arch=x86_64 init=/init 
}

