menuentry "NexOS(default)" {
    kernel BOOT/NEX386.ELF
    module BOOT/RAMDISK.IMG
    module BOOT/FONT.HEX
    cmdline console=framebuffer video=1024x768x32 root=NexOS arch=i386 init=/init
}

